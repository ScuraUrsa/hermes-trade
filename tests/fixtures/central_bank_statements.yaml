# Historical central-bank decision statements for parser evaluation.
#
# Texts are SHORT EXCERPTS of real past statements, reproduced from memory:
# the decision sentences follow the official wording, surrounding sentences
# are abbreviated. Verify against federalreserve.gov / nbp.pl before relying
# on exact wording. Rates: FOMC = upper bound of the target range, NBP =
# reference rate.
cases:
  # ---------------------------------------------------------------- FOMC
  - label: fomc-2025-09-17-cut-25-with-dovish-dissent
    kind: FOMC
    expected: CUT
    previous_rate: 4.50
    expected_rate: 4.25
    text: >
      Uncertainty about the economic outlook remains elevated. The Committee is
      attentive to the risks to both sides of its dual mandate and judges that
      downside risks to employment have risen. In support of its goals and in
      light of the shift in the balance of risks, the Committee decided to lower
      the target range for the federal funds rate by 1/4 percentage point to 4 to
      4-1/4 percent. Voting against this action was Stephen I. Miran, who
      preferred to lower the target range for the federal funds rate by 1/2
      percentage point at this meeting.
  - label: fomc-2025-07-30-hold-with-two-dissents-preferring-cut
    kind: FOMC
    expected: HOLD
    previous_rate: 4.50
    expected_rate: 4.50
    text: >
      In support of its goals, the Committee decided to maintain the target range
      for the federal funds rate at 4-1/4 to 4-1/2 percent. Voting against this
      action were Michelle W. Bowman and Christopher J. Waller, who preferred to
      lower the target range for the federal funds rate by 1/4 percentage point
      at this meeting.
  - label: fomc-2025-01-29-hold
    kind: FOMC
    expected: HOLD
    previous_rate: 4.50
    expected_rate: 4.50
    text: >
      The Committee seeks to achieve maximum employment and inflation at the rate
      of 2 percent over the longer run. In support of its goals, the Committee
      decided to maintain the target range for the federal funds rate at 4‑1/4 to
      4‑1/2 percent.
  - label: fomc-2024-12-18-cut-with-hawkish-dissent
    kind: FOMC
    expected: CUT
    previous_rate: 4.75
    expected_rate: 4.50
    text: >
      In support of its goals, the Committee decided to lower the target range for
      the federal funds rate by 1/4 percentage point to 4-1/4 to 4-1/2 percent.
      Voting against the action was Beth M. Hammack, who preferred to maintain the
      target range for the federal funds rate at 4-1/2 to 4-3/4 percent.
  - label: fomc-2024-09-18-cut-50
    kind: FOMC
    expected: CUT
    previous_rate: 5.50
    expected_rate: 5.00
    text: >
      In light of the progress on inflation and the balance of risks, the
      Committee decided to lower the target range for the federal funds rate by
      1/2 percentage point to 4-3/4 to 5 percent. Voting against this action was
      Michelle W. Bowman, who preferred to lower the target range for the federal
      funds rate by 1/4 percentage point at this meeting.
  - label: fomc-2023-07-26-hike
    kind: FOMC
    expected: HIKE
    previous_rate: 5.25
    expected_rate: 5.50
    text: >
      In support of these goals, the Committee decided to raise the target range
      for the federal funds rate to 5-1/4 to 5-1/2 percent. The Committee will
      continue to assess additional information and its implications for monetary
      policy.
  - label: fomc-2022-06-15-hike-75
    kind: FOMC
    expected: HIKE
    previous_rate: 1.00
    expected_rate: 1.75
    text: >
      In support of these goals, the Committee decided to raise the target range
      for the federal funds rate to 1-1/2 to 1-3/4 percent and anticipates that
      ongoing increases in the target range will be appropriate.
  - label: fomc-2020-03-15-emergency-cut-to-zero
    kind: FOMC
    expected: CUT
    previous_rate: 1.25
    expected_rate: 0.25
    text: >
      Consistent with its statutory mandate, the Committee seeks to foster maximum
      employment and price stability. In light of these developments, the
      Committee decided to lower the target range for the federal funds rate to 0
      to 1/4 percent.

  # ---------------------------------------------------------------- NBP RPP
  - label: nbp-2025-07-02-cut-25
    kind: NBP_RPP
    expected: CUT
    previous_rate: 5.25
    expected_rate: 5.00
    text: >
      Komunikat po posiedzeniu Rady Polityki Pieniężnej w dniach 1-2 lipca 2025 r.
      Rada postanowiła obniżyć stopy procentowe NBP o 0,25 pkt proc., ustalając je
      na poziomie: stopa referencyjna 5,00% w skali rocznej; stopa lombardowa 5,50%
      w skali rocznej; stopa depozytowa 4,50% w skali rocznej; stopa redyskontowa
      weksli 5,05% w skali rocznej; stopa dyskontowa weksli 5,10% w skali rocznej.
  - label: nbp-2025-05-07-cut-50
    kind: NBP_RPP
    expected: CUT
    previous_rate: 5.75
    expected_rate: 5.25
    text: >
      Rada Polityki Pieniężnej postanowiła obniżyć stopy procentowe NBP o 0,50 pkt
      proc., ustalając je na poziomie: stopa referencyjna 5,25% w skali rocznej;
      stopa lombardowa 5,75% w skali rocznej; stopa depozytowa 4,75% w skali
      rocznej.
  - label: nbp-2024-11-06-hold
    kind: NBP_RPP
    expected: HOLD
    previous_rate: 5.75
    expected_rate: 5.75
    text: >
      Rada postanowiła pozostawić stopy procentowe NBP bez zmian, tj.: stopa
      referencyjna 5,75% w skali rocznej; stopa lombardowa 6,25% w skali rocznej;
      stopa depozytowa 5,25% w skali rocznej; stopa redyskontowa weksli 5,80% w
      skali rocznej; stopa dyskontowa weksli 5,85% w skali rocznej.
  - label: nbp-2025-06-04-hold-ascii-scrape
    kind: NBP_RPP
    expected: HOLD
    previous_rate: 5.25
    expected_rate: 5.25
    text: >
      Rada postanowila pozostawic stopy procentowe NBP na niezmienionym poziomie:
      stopa referencyjna 5,25% w skali rocznej; stopa lombardowa 5,75% w skali
      rocznej; stopa depozytowa 4,75% w skali rocznej.
  - label: nbp-2023-09-06-cut-75
    kind: NBP_RPP
    expected: CUT
    previous_rate: 6.75
    expected_rate: 6.00
    text: >
      Rada postanowiła obniżyć stopy procentowe NBP o 0,75 pkt proc., ustalając je
      na poziomie: stopa referencyjna 6,00% w skali rocznej; stopa lombardowa
      6,50% w skali rocznej; stopa depozytowa 5,50% w skali rocznej.
  - label: nbp-2022-09-07-hike-25
    kind: NBP_RPP
    expected: HIKE
    previous_rate: 6.50
    expected_rate: 6.75
    text: >
      Rada postanowiła podwyższyć stopy procentowe NBP o 0,25 pkt proc., ustalając
      je na poziomie: stopa referencyjna 6,75% w skali rocznej; stopa lombardowa
      7,25% w skali rocznej; stopa depozytowa 6,25% w skali rocznej.
  - label: nbp-2021-10-06-hike-40
    kind: NBP_RPP
    expected: HIKE
    previous_rate: 0.10
    expected_rate: 0.50
    text: >
      Rada postanowiła podwyższyć stopy procentowe NBP, ustalając je na poziomie:
      stopa referencyjna 0,50% w skali rocznej; stopa lombardowa 1,00% w skali
      rocznej; stopa depozytowa 0,00% w skali rocznej.
