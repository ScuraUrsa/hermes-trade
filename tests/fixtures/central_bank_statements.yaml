# Historical central-bank decision statements for parser evaluation.
#
# Texts are SHORT EXCERPTS (decision sentence + any dissent sentence) of real
# past statements. Rates: FOMC = upper bound of the target range, NBP =
# reference rate. Extra keys (source, verified) are ignored by load_cases.
#
# FOMC cases: verified 2026-10-20 against the federalreserve.gov press release
# linked in each case's `source` (date, decision, range, and verbatim wording
# of the quoted sentences).
#
# NBP RPP cases: NOT verified -- nbp.pl was unreachable from the verification
# environment on 2026-10-20. These are still WRITTEN FROM MEMORY: the decision
# sentences follow the usual communique wording but dates, levels and exact
# phrasing must be checked against nbp.pl ("Komunikat po posiedzeniu Rady
# Polityki Pienieznej") before relying on them.
cases:
  # ---------------------------------------------------------------- FOMC
  - label: fomc-2026-09-16-hike-25
    kind: FOMC
    expected: HIKE
    previous_rate: 3.75
    expected_rate: 4.00
    source: https://www.federalreserve.gov/newsevents/pressreleases/monetary20260916a.htm
    verified: true
    text: >
      The Committee decided to raise the target range for the federal funds
      rate by 1/4 percentage point to 3-3/4 to 4 percent, in support of the
      Federal Reserve's dual mandate.
  - label: fomc-2025-09-17-cut-25-with-dovish-dissent
    kind: FOMC
    expected: CUT
    previous_rate: 4.50
    expected_rate: 4.25
    source: https://www.federalreserve.gov/newsevents/pressreleases/monetary20250917a.htm
    verified: true
    text: >
      In support of its goals and in light of the shift in the balance of risks,
      the Committee decided to lower the target range for the federal funds rate
      by 1/4 percentage point to 4 to 4‑1/4 percent. Voting against this action
      was Stephen I. Miran, who preferred to lower the target range for the
      federal funds rate by 1/2 percentage point at this meeting.
  - label: fomc-2025-07-30-hold-with-two-dissents-preferring-cut
    kind: FOMC
    expected: HOLD
    previous_rate: 4.50
    expected_rate: 4.50
    source: https://www.federalreserve.gov/newsevents/pressreleases/monetary20250730a.htm
    verified: true
    text: >
      In support of its goals, the Committee decided to maintain the target range
      for the federal funds rate at 4-1/4 to 4-1/2 percent. Voting against this
      action were Michelle W. Bowman and Christopher J. Waller, who preferred to
      lower the target range for the federal funds rate by 1/4 percentage point
      at this meeting.
  - label: fomc-2025-01-29-hold
    kind: FOMC
    expected: HOLD
    previous_rate: 4.50
    expected_rate: 4.50
    source: https://www.federalreserve.gov/newsevents/pressreleases/monetary20250129a.htm
    verified: true
    text: >
      In support of its goals, the Committee decided to maintain the target range
      for the federal funds rate at 4-1/4 to 4-1/2 percent.
  - label: fomc-2024-12-18-cut-with-hawkish-dissent
    kind: FOMC
    expected: CUT
    previous_rate: 4.75
    expected_rate: 4.50
    source: https://www.federalreserve.gov/newsevents/pressreleases/monetary20241218a.htm
    verified: true
    text: >
      In support of its goals, the Committee decided to lower the target range for
      the federal funds rate by 1/4 percentage point to 4-1/4 to 4-1/2 percent.
      Voting against the action was Beth M. Hammack, who preferred to maintain the
      target range for the federal funds rate at 4-1/2 to 4-3/4 percent.
  - label: fomc-2024-09-18-cut-50
    kind: FOMC
    expected: CUT
    previous_rate: 5.50
    expected_rate: 5.00
    source: https://www.federalreserve.gov/newsevents/pressreleases/monetary20240918a.htm
    verified: true
    text: >
      In light of the progress on inflation and the balance of risks, the
      Committee decided to lower the target range for the federal funds rate by
      1/2 percentage point to 4-3/4 to 5 percent. Voting against this action was
      Michelle W. Bowman, who preferred to lower the target range for the federal
      funds rate by 1/4 percentage point at this meeting.
  - label: fomc-2023-07-26-hike
    kind: FOMC
    expected: HIKE
    previous_rate: 5.25
    expected_rate: 5.50
    source: https://www.federalreserve.gov/newsevents/pressreleases/monetary20230726a.htm
    verified: true
    text: >
      In support of these goals, the Committee decided to raise the target range
      for the federal funds rate to 5-1/4 to 5-1/2 percent.
  - label: fomc-2022-06-15-hike-75-with-dissent
    kind: FOMC
    expected: HIKE
    previous_rate: 1.00
    expected_rate: 1.75
    source: https://www.federalreserve.gov/newsevents/pressreleases/monetary20220615a.htm
    verified: true
    text: >
      In support of these goals, the Committee decided to raise the target range
      for the federal funds rate to 1‑1/2 to 1-3/4 percent and anticipates that
      ongoing increases in the target range will be appropriate. Voting against
      this action was Esther L. George, who preferred at this meeting to raise the
      target range for the federal funds rate by 0.5 percentage point to 1-1/4
      percent to 1-1/2 percent.
  - label: fomc-2020-03-15-emergency-cut-to-zero-with-dissent
    kind: FOMC
    expected: CUT
    previous_rate: 1.25
    expected_rate: 0.25
    source: https://www.federalreserve.gov/newsevents/pressreleases/monetary20200315a.htm
    verified: true
    text: >
      In light of these developments, the Committee decided to lower the target
      range for the federal funds rate to 0 to 1/4 percent. Voting against this
      action was Loretta J. Mester, who was fully supportive of all of the actions
      taken to promote the smooth functioning of markets and the flow of credit
      to households and businesses but preferred to reduce the target range for
      the federal funds rate to 1/2 to 3/4 percent at this meeting.

