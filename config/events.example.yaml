# Example event playbooks for the scenario machine — PAPER ONLY.
#
# Load with: hermes_trade.events.load_playbooks("config/events.example.yaml")
#
# Everything marked "TODO verify" is a placeholder and must be checked and
# refreshed the day before the event:
#   * meeting dates / announcement times (federalreserve.gov, nbp.pl calendar)
#   * previous_rate (current FOMC upper bound / NBP reference rate)
#   * expected_probability (market pricing: CME FedWatch, FRA/OIS for PLN)
#   * stop_price / take_profit_price (absolute levels, from current quotes)
#
# Surprise is relative to the market expectation (highest probability):
# e.g. if CUT is priced at 80% and the Fed HOLDs, that is a hawkish surprise,
# even though the rate did not move.
#
# Sizes are deliberately tiny (paper). risk limits come from RiskManager.

playbooks:
  # ------------------------------------------------------------------ FOMC
  - event:
      id: fomc-2026-10-28
      kind: FOMC
      # verified 2026-10-20: federalreserve.gov/monetarypolicy/fomccalendars.htm
      # lists the Oct 27-28, 2026 meeting; Board calendar shows 2:00 p.m. (EDT).
      scheduled_at: "2026-10-28T18:00:00Z"
      source_url: https://www.federalreserve.gov/newsevents/pressreleases.htm
      # verified 2026-10-20: Sep 16, 2026 statement raised the range by 1/4 pt
      # to 3-3/4 to 4 percent -> upper bound 4.00.
      previous_rate: "4.00"
    scenarios:
      - name: CUT
        expected_probability: 0.70           # TODO verify (FedWatch)
        description: priced outcome, 25 bp cut
      - name: HOLD
        expected_probability: 0.28           # TODO verify
        description: hawkish surprise vs. priced cut
      - name: HIKE
        expected_probability: 0.02           # TODO verify
        description: very hawkish surprise (tail)
    plans:
      CUT:
        scenario: CUT
        notes: no surprise — priced in; do nothing, keep pre-position (if any)
        legs: []
      HOLD:
        scenario: HOLD
        notes: hawkish surprise — duration and equities down
        legs:
          - signal:
              symbol: TLT
              side: sell
              quantity: "5"
              order_type: market
              stop_price: "92.00"            # TODO verify (above entry)
              confidence: 0.7
              reason: "FOMC hawkish surprise: HOLD vs priced CUT -> long yields up"
            take_profit_price: "87.00"       # TODO verify (below entry)
          - signal:
              symbol: SPY
              side: sell
              quantity: "2"
              order_type: market
              stop_price: "690.00"           # TODO verify
              confidence: 0.6
              reason: "FOMC hawkish surprise: HOLD vs priced CUT -> equities down"
            take_profit_price: "660.00"      # TODO verify
      HIKE:
        scenario: HIKE
        notes: very hawkish surprise (two steps) — same direction, still small size
        legs:
          - signal:
              symbol: TLT
              side: sell
              quantity: "8"
              order_type: market
              stop_price: "92.00"            # TODO verify
              confidence: 0.75
              reason: "FOMC very hawkish surprise: HIKE vs priced CUT"
            take_profit_price: "85.00"       # TODO verify
          - signal:
              symbol: SPY
              side: sell
              quantity: "3"
              order_type: market
              stop_price: "690.00"           # TODO verify
              confidence: 0.65
              reason: "FOMC very hawkish surprise: HIKE vs priced CUT"
            take_profit_price: "650.00"      # TODO verify
    prepositioned:
      scenario: CUT
      max_total_quantity: "3"
      notes: small long duration before the expected cut; unwound at market if no cut
      legs:
        - signal:
            symbol: TLT
            side: buy
            quantity: "3"
            order_type: market
            stop_price: "87.50"              # TODO verify (below entry)
            confidence: 0.6
            reason: "Pre-position for expected FOMC cut"
          take_profit_price: "92.50"         # TODO verify

  # --------------------------------------------------------------- NBP RPP
  - event:
      id: nbp-rpp-2026-11-04
      kind: NBP_RPP
      # verified 2026-10-29 (nbp.pl not reachable directly; secondary sources):
      #   * date: decision meeting 3-4 Nov 2026 per the NBP 2026 RPP schedule as
      #     republished at ksiegowosc.infor.pl/obrot-gospodarczy/finanse-i-inwestycje/
      #     7451398,harmonogram-posiedzen-rady-polityki-pienieznej-w-2026-roku.html
      #   * previous_rate: 3.75% reference rate, held at the 6-7 Oct 2026 meeting
      #     (unchanged since the 5 Mar 2026 cut), per finwire.pl/artykuly/
      #     stopy-procentowe-nbp-pazdziernik-2026-375-decyzja-rpp-rata-kredytu
      # The communique time is not fixed in advance; recheck schedule on nbp.pl.
      scheduled_at: "2026-11-04T13:00:00Z"   # TODO verify time of day only
      source_url: https://nbp.pl/polityka-pieniezna/decyzje-rpp/komunikaty-rpp/
      previous_rate: "3.75"
    scenarios:
      - name: CUT
        expected_probability: 0.25           # TODO verify (FRA/OIS pricing)
        description: dovish surprise vs. priced hold
      - name: HOLD
        expected_probability: 0.73           # TODO verify
        description: priced outcome
      - name: HIKE
        expected_probability: 0.02           # TODO verify
        description: hawkish tail
    plans:
      CUT:
        scenario: CUT
        notes: >
          dovish surprise — PLN weaker. EPOL (iShares MSCI Poland, USD-denominated)
          is a rough USD/PLN proxy: weaker PLN tends to push it down in USD terms.
        legs:
          - signal:
              symbol: EPOL
              side: sell
              quantity: "5"
              order_type: market
              stop_price: "33.00"            # TODO verify
              confidence: 0.6
              reason: "RPP dovish surprise: CUT vs priced HOLD -> PLN weaker"
            take_profit_price: "30.00"       # TODO verify
      HOLD:
        scenario: HOLD
        notes: no surprise — do nothing
        legs: []
      HIKE:
        scenario: HIKE
        notes: hawkish surprise — PLN stronger
        legs:
          - signal:
              symbol: EPOL
              side: buy
              quantity: "5"
              order_type: market
              stop_price: "30.00"            # TODO verify
              confidence: 0.6
              reason: "RPP hawkish surprise: HIKE vs priced HOLD -> PLN stronger"
            take_profit_price: "34.00"       # TODO verify
